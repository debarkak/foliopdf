<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2a23">
  <title>FolioPDF</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.65 system-ui, sans-serif; background: #f4f6f2; color: #202923; }
    body { max-width: 760px; margin: 0 auto; padding: 8vh 24px; }
    main { padding: clamp(24px, 6vw, 56px); border: 1px solid #ccd5cb; border-radius: 24px; background: #fff; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -.06em; }
    p { max-width: 54ch; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { display: inline-block; padding: 10px 16px; border: 1px solid #bbc7bb; border-radius: 999px; color: inherit; text-decoration: none; }
    a:first-child { background: #e0eee1; border-color: #b8cfba; }
    a:hover { border-color: #5a785e; }
    @media (prefers-color-scheme: dark) { :root { background: #111611; color: #e3e9e1; } main { background: #1c241e; border-color: #364338; } a { border-color: #435246; } a:first-child { background: #29392c; border-color: #506f54; } }
  </style>
</head>
<body>
  <main>
    <h1>FolioPDF</h1>
    <p>A lightweight PDF reader built on Mozilla's PDF.js. Read, search, zoom and annotate local PDF files.</p>
    <nav aria-label="FolioPDF links">
      <a href="apt/">Install with APT</a>
      <a href="https://github.com/debarkak/foliopdf">Source and releases</a>
      <a href="https://github.com/debarkak/foliopdf/blob/main/docs/user-guide.md">User guide</a>
    </nav>
  </main>
</body>
</html>
