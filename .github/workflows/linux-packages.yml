name: Linux packages
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v1.0.18
      - name: Collect and publish release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts/linux /tmp/artifacts/windows /tmp/release
          gh run download 43396136366 --repo "$GITHUB_REPOSITORY" --name linux-packages --dir /tmp/artifacts/linux
          gh run download 43396113450 --repo "$GITHUB_REPOSITORY" --name windows-packages --dir /tmp/artifacts/windows
          names=(FolioPDF_1.0.18_x64-setup.exe FolioPDF-1.0.18-windows-x64.zip FolioPDF_1.0.18_amd64.deb FolioPDF_1.0.18_amd64.AppImage FolioPDF-1.0.18-linux-x86_64.tar.gz FolioPDF_1.0.18_x64-setup.exe.sig FolioPDF_1.0.18_amd64.AppImage.sig)
          for name in "${names[@]}"; do
            mapfile -t found < <(find /tmp/artifacts -type f -name "$name")
            test "${#found[@]}" -eq 1
            cp "${found[0]}" /tmp/release/
          done
          printf '%s\n' 'document details, toolbar labels and recent PDFs on Home.' > /tmp/update-notes.txt
          printf "%s\n" "## what's new" '' '- inspect PDF details and embedded metadata' '- show optional toolbar labels' '- reopen recent PDFs with configurable history retention' '- open a Home tab with the plus button' '' 'Windows setup and Linux AppImage can update from Settings. other builds can be downloaded below.' > /tmp/release-notes.md
          dpkg-deb -x /tmp/release/FolioPDF_1.0.18_amd64.deb /tmp/deb-check
          desktop=$(find /tmp/deb-check/usr/share/applications -name '*.desktop' -print -quit)
          test -n "$desktop"
          grep -Fx 'MimeType=application/pdf;' "$desktop"
          grep -E '^Exec=.* %f$' "$desktop"
          node scripts/update-manifest.mjs /tmp/release /tmp/release/FolioPDF_1.0.18_x64-setup.exe /tmp/release/FolioPDF_1.0.18_amd64.AppImage /tmp/update-notes.txt
          cd /tmp/release
          sha256sum "${names[@]}" latest.json > SHA256SUMS.txt
          gh release create v1.0.18 "${names[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title 'FolioPDF 1.0.18 (2026-11-13)' --notes-file /tmp/release-notes.md
          verify() {
            gh api "repos/$GITHUB_REPOSITORY/releases" > /tmp/releases.json
            python3 - "$1" <<'PY'
          import hashlib, json, os, sys
          releases = json.load(open('/tmp/releases.json'))
          release = next(r for r in releases if r['tag_name'] == 'v1.0.18')
          assert release['draft'] and len(release['assets']) == int(sys.argv[1])
          for asset in release['assets']:
              with open(asset['name'], 'rb') as f:
                  digest = hashlib.file_digest(f, 'sha256').hexdigest()
              assert asset['size'] == os.path.getsize(asset['name'])
              assert asset['digest'] == 'sha256:' + digest, asset['name']
          PY
          }
          verify 8
          gh release upload v1.0.18 latest.json --repo "$GITHUB_REPOSITORY"
          verify 9
          gh release edit v1.0.18 --repo "$GITHUB_REPOSITORY" --draft=false --latest
