name: Windows packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci
      - name: Check the reader
        run: |
          npx playwright install chromium
          npm test
      - name: Build signed update installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis
      - name: Prepare portable archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = Join-Path $env:RUNNER_TEMP "FolioPDF-$version-windows-x64"
          New-Item -ItemType Directory $directory | Out-Null
          Copy-Item src-tauri/target/release/foliopdf.exe "$directory/FolioPDF.exe"
          Copy-Item LICENSE, README.md, public/THIRD-PARTY-NOTICES.txt $directory
          Compress-Archive "$directory/*" "src-tauri/target/release/FolioPDF-$version-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/FolioPDF-*-windows-x64.zip
