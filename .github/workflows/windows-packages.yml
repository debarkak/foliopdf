name: Windows packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c113756f6be761300605cc3107966ab14b00f3e8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci
      - name: Check the reader
        run: |
          npx playwright install chromium
          npm test
      - name: Fetch pinned installer tools via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          gh api -H 'Accept: application/octet-stream' repos/tauri-apps/binary-releases/releases/assets/623832696 > $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8') { throw 'NSIS checksum mismatch' }
          Expand-Archive $archive -DestinationPath $cache
          Move-Item (Join-Path $cache 'nsis-3.13') (Join-Path $cache 'NSIS')
          $plugins = Join-Path $cache 'NSIS/Plugins/x86-unicode/additional'
          New-Item -ItemType Directory -Force $plugins | Out-Null
          $plugin = Join-Path $plugins 'nsis_tauri_utils.dll'
          gh api -H 'Accept: application/octet-stream' repos/tauri-apps/nsis-tauri-utils/releases/assets/345882097 > $plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $plugin -Algorithm SHA256).Hash -ne '5BA143B5DB4A87D32D6E7802E033330AAE56CBCEABE0D1E3BA41948385AD4709') { throw 'NSIS plugin checksum mismatch' }
      - name: Build signed update installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis
      - name: Test the installed PDF association
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $directory = Join-Path $env:RUNNER_TEMP 'FolioPDF association test'
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$directory") -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $directory 'foliopdf.exe'
          $command = (Get-Item 'HKCU:\Software\Classes\FolioPDF.PDF\shell\open\command').GetValue('')
          if ($command -cne ('"' + $exe + '" "%1"')) { throw "Bad command: $command" }
          $icon = (Get-Item 'HKCU:\Software\Classes\FolioPDF.PDF\DefaultIcon').GetValue('')
          if ($icon -cne ('"' + $exe + '",0')) { throw "Bad icon: $icon" }
          if ((Get-ItemPropertyValue 'HKCU:\Software\Classes\FolioPDF.PDF\Application' 'ApplicationName') -ne 'FolioPDF') { throw 'Friendly name missing' }
          $env:FOLIOPDF_QA_EXE = $exe
          $env:FOLIOPDF_QA_DIR = $directory
          @'
          import { spawnSync } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { chromium } from 'playwright';
          import { makePdf } from './tests/pdf-fixture.mjs';
          const file = join(process.env.FOLIOPDF_QA_DIR, 'PDF with spaces.pdf');
          await writeFile(file, makePdf('Installed association test'));
          const launch = spawnSync('powershell.exe', ['-NoProfile', '-Command', '$c=(Get-Item "HKCU:\\Software\\Classes\\FolioPDF.PDF\\shell\\open\\command").GetValue(""); $c=$c.Replace("%1",$env:FOLIOPDF_QA_FILE); Start-Process -FilePath $env:FOLIOPDF_QA_EXE -ArgumentList ([char]34+$env:FOLIOPDF_QA_FILE+[char]34)'], {env: {...process.env, FOLIOPDF_QA_FILE: file, WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: '--remote-debugging-port=9483', WEBVIEW2_USER_DATA_FOLDER: join(process.env.FOLIOPDF_QA_DIR, 'qa-webview')}});
          if (launch.status !== 0) throw Error('Registered launch failed');
          const { readFile } = await import('node:fs/promises');
          const history = join(process.env.LOCALAPPDATA, 'io.github.debarkak.foliopdf', 'recent-pdfs.json');
          let opened = false;
          for(let i=0;i<150;i++) {
            try {
              const entries = JSON.parse(await readFile(history, 'utf8'));
              if(entries.some(entry => entry.path.toLowerCase() === file.toLowerCase())) {
                opened = true;
                break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve,200));
          }
          if(!opened) throw Error('The installed app did not successfully load the associated PDF');
          console.log('Installed app successfully loads a PDF with spaces and records it in history.');
          '@ | Set-Content installer-association-check.mjs
          node installer-association-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed association test failed' }
          Get-Process foliopdf -ErrorAction SilentlyContinue | Where-Object Path -eq $exe | Stop-Process -Force
          Start-Sleep -Seconds 1
          $uninstall = Start-Process "$directory/uninstall.exe" -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path 'HKCU:\Software\Classes\FolioPDF.PDF') { throw 'Association remains after uninstall' }
      - name: Prepare portable archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = Join-Path $env:RUNNER_TEMP "FolioPDF-$version-windows-x64"
          New-Item -ItemType Directory $directory | Out-Null
          Copy-Item src-tauri/target/release/foliopdf.exe "$directory/FolioPDF.exe"
          Copy-Item LICENSE, README.md, public/THIRD-PARTY-NOTICES.txt $directory
          Compress-Archive "$directory/*" "src-tauri/target/release/FolioPDF-$version-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/FolioPDF-*-windows-x64.zip
