name: Windows packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: de1e5d3e7db513f7562f470ad7ca42b97c8d3902
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci
      - name: Check the reader
        run: |
          npx playwright install chromium
          npm test
      - name: Fetch pinned installer tools via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          gh api -H 'Accept: application/octet-stream' repos/tauri-apps/binary-releases/releases/assets/623832696 > $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8') { throw 'NSIS checksum mismatch' }
          Expand-Archive $archive -DestinationPath $cache
          Move-Item (Join-Path $cache 'nsis-3.13') (Join-Path $cache 'NSIS')
          $plugins = Join-Path $cache 'NSIS/Plugins/x86-unicode/additional'
          New-Item -ItemType Directory -Force $plugins | Out-Null
          $plugin = Join-Path $plugins 'nsis_tauri_utils.dll'
          gh api -H 'Accept: application/octet-stream' repos/tauri-apps/nsis-tauri-utils/releases/assets/345882097 > $plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $plugin -Algorithm SHA256).Hash -ne '5BA143B5DB4A87D32D6E7802E033330AAE56CBCEABE0D1E3BA41948385AD4709') { throw 'NSIS plugin checksum mismatch' }
      - name: Build signed update installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis
      - name: Prepare portable archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = Join-Path $env:RUNNER_TEMP "FolioPDF-$version-windows-x64"
          New-Item -ItemType Directory $directory | Out-Null
          Copy-Item src-tauri/target/release/foliopdf.exe "$directory/FolioPDF.exe"
          Copy-Item LICENSE, README.md, public/THIRD-PARTY-NOTICES.txt $directory
          Compress-Archive "$directory/*" "src-tauri/target/release/FolioPDF-$version-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/FolioPDF-*-windows-x64.zip
