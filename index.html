<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>FolioPDF</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar" aria-label="Reader toolbar">
        <div class="file-tools">
          <button id="open" class="open-button" title="Open PDF (Ctrl+O)">
            <i data-lucide="folder-open" aria-hidden="true"></i><span>Open</span>
          </button>
          <span id="filename" class="filename">FolioPDF</span>
        </div>
        <div class="page-tools" role="group" aria-label="Page navigation">
          <button id="previous" aria-label="Previous page" title="Previous page" disabled><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <label class="page-label"><span class="sr-only">Page</span><input id="page-number" type="number" min="1" value="1" disabled /></label>
          <span id="page-count" class="page-count">/ 0</span>
          <button id="next" aria-label="Next page" title="Next page" disabled><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        </div>
        <div class="zoom-tools" role="group" aria-label="Zoom">
          <button id="zoom-out" aria-label="Zoom out" title="Zoom out (Ctrl+−)" disabled><i data-lucide="minus" aria-hidden="true"></i></button>
          <select id="zoom" aria-label="Zoom" disabled>
            <option value="page-width">Fit width</option>
            <option value="page-fit">Fit page</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100% · actual size</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option value="4">400%</option>
          </select>
          <button id="zoom-in" aria-label="Zoom in" title="Zoom in (Ctrl++)" disabled><i data-lucide="plus" aria-hidden="true"></i></button>
        </div>
      </header>
      <main id="document-area" aria-label="PDF document" aria-busy="false">
        <div id="viewer-container" hidden><div id="viewer" class="pdfViewer"></div></div>
        <section id="empty-state" class="empty-state">
          <div class="empty-content">
            <div class="book-symbol" aria-hidden="true"><i data-lucide="book-open"></i></div>
            <h1>A little room to read.</h1>
            <p>Open a PDF to get started.</p>
            <button id="open-empty" class="primary-button"><i data-lucide="folder-open" aria-hidden="true"></i>Open PDF</button>
            <span class="shortcut">Ctrl+O</span>
          </div>
        </section>
        <div id="loading" class="loading" role="status" hidden>Opening PDF…</div>
      </main>
      <footer class="statusbar"><span id="status" role="status" aria-live="polite">Ready</span></footer>
      <dialog id="error-dialog" aria-labelledby="error-title">
        <h2 id="error-title">Couldn't open this PDF</h2>
        <p id="error-message"></p>
        <form method="dialog"><button class="primary-button">Close</button></form>
      </dialog>
      <input id="file-input" type="file" accept=".pdf,application/pdf" hidden />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
