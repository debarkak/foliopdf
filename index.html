<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>FolioPDF</title>
  </head>
  <body>
    <div id="app">
      <div id="tabs-bar" class="tabs-bar" hidden>
        <div id="document-tabs" class="document-tabs" role="tablist" aria-label="Open documents"></div>
      </div>
      <header class="toolbar" aria-label="Reader toolbar">
        <div class="file-tools">
          <button id="open" class="open-button" title="Open PDF (Ctrl+O)">
            <i data-lucide="folder-open" aria-hidden="true"></i><span>Open</span>
          </button>
          <span id="filename" class="filename">FolioPDF</span>
          <button id="appearance-open" aria-label="Appearance settings" title="Appearance settings"><i data-lucide="palette" aria-hidden="true"></i></button>
          <button id="find-toggle" aria-label="Find in document" title="Find in document (Ctrl+F)" aria-controls="find-bar" aria-expanded="false" disabled><i data-lucide="search" aria-hidden="true"></i></button>
        </div>
        <div class="page-tools" role="group" aria-label="Page navigation">
          <button id="previous" aria-label="Previous page" title="Previous page" disabled><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <label class="page-label"><span class="sr-only">Page</span><input id="page-number" type="number" min="1" value="1" disabled /></label>
          <span id="page-count" class="page-count">/ 0</span>
          <button id="next" aria-label="Next page" title="Next page" disabled><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        </div>
        <div class="zoom-tools" role="group" aria-label="Zoom">
          <button id="zoom-out" aria-label="Zoom out" title="Zoom out (Ctrl+−)" disabled><i data-lucide="minus" aria-hidden="true"></i></button>
          <select id="zoom" aria-label="Zoom" disabled>
            <option value="page-width">Fit width</option>
            <option value="page-fit">Fit page</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100% · actual size</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option value="4">400%</option>
          </select>
          <button id="zoom-in" aria-label="Zoom in" title="Zoom in (Ctrl++)" disabled><i data-lucide="plus" aria-hidden="true"></i></button>
        </div>
        <div class="layout-tools" role="group" aria-label="Page direction">
          <button id="layout-vertical" aria-label="Vertical pages" title="Vertical pages" aria-pressed="true" disabled><i data-lucide="rows-2" aria-hidden="true"></i></button>
          <button id="layout-horizontal" aria-label="Horizontal pages" title="Horizontal pages" aria-pressed="false" disabled><i data-lucide="columns-2" aria-hidden="true"></i></button>
        </div>
      </header>
      <section id="find-bar" class="find-bar" role="search" aria-label="Find in document" hidden>
        <input id="find-query" type="search" aria-label="Find text" placeholder="Find in this PDF" autocomplete="off" spellcheck="false" />
        <span id="find-count" role="status" aria-live="polite"></span>
        <button id="find-previous" aria-label="Previous match" title="Previous match (Shift+Enter)" disabled><i data-lucide="arrow-up" aria-hidden="true"></i></button>
        <button id="find-next" aria-label="Next match" title="Next match (Enter)" disabled><i data-lucide="arrow-down" aria-hidden="true"></i></button>
        <button id="find-close" aria-label="Close search" title="Close search (Esc)"><i data-lucide="x" aria-hidden="true"></i></button>
      </section>
      <main id="document-area" aria-label="PDF document" aria-busy="false">
        <div id="viewer-container" role="tabpanel" hidden><div id="viewer" class="pdfViewer"></div></div>
        <section id="empty-state" class="empty-state">
          <div class="empty-content">
            <div class="book-symbol" aria-hidden="true"><i data-lucide="book-open"></i></div>
            <h1>A little room to read.</h1>
            <p>Open a PDF to get started.</p>
            <button id="open-empty" class="primary-button"><i data-lucide="folder-open" aria-hidden="true"></i>Open PDF</button>
            <span class="shortcut">Ctrl+O</span>
          </div>
        </section>
        <div id="loading" class="loading" role="status" hidden>Opening PDF…</div>
      </main>
      <footer class="statusbar"><span id="status" role="status" aria-live="polite">Ready</span><button id="about" aria-label="About and updates">About / Updates</button></footer>
      <dialog id="appearance-dialog" aria-labelledby="appearance-title">
        <h2 id="appearance-title">Appearance</h2>
        <label class="appearance-label" for="appearance-theme">Theme</label>
        <select id="appearance-theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
        <fieldset class="palette-options"><legend>Color</legend>
          <label><input type="radio" name="palette" value="sage" /> <span class="swatch sage"></span>Sage</label>
          <label><input type="radio" name="palette" value="ocean" /> <span class="swatch ocean"></span>Ocean</label>
          <label><input type="radio" name="palette" value="lavender" /> <span class="swatch lavender"></span>Lavender</label>
          <label><input type="radio" name="palette" value="sand" /> <span class="swatch sand"></span>Sand</label>
        </fieldset>
        <form method="dialog"><button class="primary-button">Done</button></form>
      </dialog>
      <dialog id="updates-dialog" aria-labelledby="updates-title">
        <h2 id="updates-title">FolioPDF</h2>
        <p id="app-version"></p>
        <p id="update-status" role="status" aria-live="polite">Check for a newer version.</p>
        <p id="update-notes" hidden></p>
        <progress id="update-progress" aria-label="Update download" hidden></progress>
        <p id="update-warning" hidden>Installing closes FolioPDF and its open tabs. Your PDF files will not be changed.</p>
        <div class="dialog-actions">
          <button id="update-close">Close</button>
          <button id="update-check">Check for updates</button>
          <button id="update-action" class="primary-button" hidden>Download update</button>
        </div>
      </dialog>
      <dialog id="error-dialog" aria-labelledby="error-title">
        <h2 id="error-title">Couldn't open this PDF</h2>
        <p id="error-message"></p>
        <form method="dialog"><button class="primary-button">Close</button></form>
      </dialog>
      <input id="file-input" type="file" accept=".pdf,application/pdf" hidden />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
