[package]
name = "foliopdf"
version = "1.0.14"
description = "A lightweight PDF reader built on PDF.js"
authors = ["debarkak"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
